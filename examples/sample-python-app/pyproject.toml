[project]
name = "sample-python-app"
version = "0.1.0"
description = "Small weather-alert service with a CLI."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
